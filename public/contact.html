<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
</head>
<body>
  <!-- This file ensures Netlify detects the form at build time -->
  <form name="contact" netlify hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
